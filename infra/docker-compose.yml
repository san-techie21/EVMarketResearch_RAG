# Full self-host stack for Voltaic (EV Market Research RAG).
#
#   cd infra && cp .env.example .env   # then add your LLM key to .env
#   docker compose up -d --build       # db + api + web, all of it
#
# Then open http://localhost:3000  (api on :8000, db on :55432)
# No DigitalOcean, no cloud Postgres - everything runs locally.

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: evrag-db
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-evrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evrag_dev_pw}
      POSTGRES_DB:       ${POSTGRES_DB:-ev_research}
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - evrag_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evrag} -d ${POSTGRES_DB:-ev_research}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: evrag-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evrag}:${POSTGRES_PASSWORD:-evrag_dev_pw}@db:5432/${POSTGRES_DB:-ev_research}
      CORS_ORIGINS: "*"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../knowledge_base:/app/knowledge_base
      - evrag_hfcache:/app/.hf-cache
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        # Browser runs on the host, so it reaches the api on the published host port.
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    container_name: evrag-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  evrag_pgdata:
  evrag_hfcache:
