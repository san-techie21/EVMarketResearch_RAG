[theme]
base                   = "light"
primaryColor           = "#4f46e5"
backgroundColor        = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor              = "#0f172a"
font                   = "sans serif"

[server]
headless               = true
# SECURITY: XSRF protection must stay ON. (Was disabled in v2.) The reverse proxy
# (Caddy/nginx) forwards WebSocket upgrade headers so this works behind a proxy.
enableCORS             = false
enableXsrfProtection   = true
